interface:
  display_name: "Atualizar T3 Code com upstream"
  short_description: "Atualiza e instala o fork preservando a API dos plugins"
  default_prompt: "Use $update-upstream para integrar upstream/main à main do fork, resolver conflitos, validar a compatibilidade e executar scripts/update-local-desktop.py para deixar a nova versão instalada, sem alterar o contrato público nem os plugins e sem reiniciar o aplicativo."
